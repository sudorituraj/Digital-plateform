<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a5559" />
    <meta
      name="description"
      content="Saran Nursing Home & Research Centre, Chapra, Bihar. Book an appointment, find the clinic and contact us easily."
    />
    <link rel="icon" type="image/png" sizes="64x64" href="/images/clinic/icon-64.png" />
    <link rel="apple-touch-icon" href="/images/clinic/icon-192.png" />
    <!-- "Add to Home screen" on Android Chrome -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Serif:wght@600;700&family=Noto+Serif+Devanagari:wght@600;700&display=swap"
    />
    <title>Saran Nursing Home & Research Centre, Chapra</title>
    <!-- Social sharing (WhatsApp/Facebook link previews). Add og:image once the clinic provides a real photo. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Saran Nursing Home & Research Centre" />
    <meta property="og:title" content="Saran Nursing Home & Research Centre, Chapra" />
    <meta property="og:description" content="Book an appointment with Dr. Neela Singh, find the clinic in Chapra, and call or WhatsApp easily." />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary" />
    <!-- Local business details for search engines. Only confirmed facts: add phone, street address,
         opening hours and URL here once the clinic verifies them (see PROJECT_STATUS.md). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MedicalClinic",
        "name": "Saran Nursing Home & Research Centre",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Chapra",
          "addressRegion": "Bihar",
          "addressCountry": "IN"
        },
        "employee": { "@type": "Physician", "name": "Dr. Neela Singh" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
